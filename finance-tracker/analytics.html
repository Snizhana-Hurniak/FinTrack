<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>FinTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#E6E7DE] min-h-screen flex">
    <!-- Sidebar -->
    <aside class="flex flex-col bg-[#E6E7DE] w-20 sm:w-56 p-4 text-[#8B8B8B] select-none">
      <div class="flex items-center gap-2 mb-8">
        <img src="image/logo-g.png" alt="Логотип FinTrack" class="w-6 h-6" />
        <span class="font-extrabold text-[#1B1B17] text-lg select-text">FinTrack</span>
      </div>
      <nav class="flex flex-col gap-4 text-xs sm:text-sm">
        <div class="uppercase font-semibold text-[#B7B7B7] mb-2 select-text">Меню</div>
        <a class="flex items-center gap-3 text-[#8B8B8B] hover:text-[#1B1B17]" href="home.html">
            <i class="fas fa-book text-[10px] sm:text-xs"></i>
            <span class="hidden sm:inline select-text">Головна панель</span>
          </a>
        <a class="flex items-center gap-3 text-[#8B8B8B] hover:text-[#1B1B17]" href="records.html">
          <i class="fas fa-book text-[10px] sm:text-xs"></i>
          <span class="hidden sm:inline select-text">Записи</span>
        </a>
        <a class="flex items-center gap-3 bg-white rounded-full px-3 py-1 text-[#1B1B17] font-semibold select-text" href="analytics.html">
            <i class="fas fa-cog text-xs"></i>
            <span class="hidden sm:inline">Аналітика</span>
          </a>
        <a class="flex items-center gap-3 text-[#8B8B8B] hover:text-[#1B1B17]" href="goals.html">
            <i class="fas fa-question-circle text-[10px] sm:text-xs"></i>
            <span class="hidden sm:inline select-text">Цілі</span>
          </a>
        <div class="uppercase font-semibold text-[#B7B7B7] mt-8 mb-2 select-text">Інше</div>
        <a class="flex items-center gap-3 text-[#8B8B8B] hover:text-[#1B1B17]" href="settings.html">
            <i class="fas fa-question-circle text-[10px] sm:text-xs"></i>
            <span class="hidden sm:inline select-text">Налаштування</span>
          </a>
          <a class="flex items-center gap-3 text-[#8B8B8B] hover:text-[#1B1B17]" href="aboutus.html">
            <i class="fas fa-question-circle text-[10px] sm:text-xs"></i>
            <span class="hidden sm:inline select-text">Про нас</span>
          </a>
        <a class="flex items-center gap-3 text-[#8B8B8B] hover:text-[#1B1B17]" href="help.html">
          <i class="fas fa-question-circle text-[10px] sm:text-xs"></i>
          <span class="hidden sm:inline select-text">Допомога</span>
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="flex-1 p-6 sm:p-10 bg-[№EAE9E3]">
      <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h1 class="text-xl font-normal text-[#1B1B17] select-text">Привіт, Олю!</h1>
          <p class="text-sm text-[#1B1B17] select-text">Готові взяти під контроль свої фінанси?</p>
        </div>
        <div class="flex items-center gap-4">
          <img alt="Фото профілю користувача" class="w-10 h-10 rounded-full object-cover" src="image/pexels-soldiervip-1408978.jpg" />
          <button class="w-10 h-10 rounded-full border border-[#1B1B17] flex items-center justify-center hover:bg-[#1B1B17] hover:text-white transition-colors" aria-label="Logout">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </header>
